name: Qualität
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, curl, mbstring
          tools: composer:v2
          coverage: none
      - name: Syntax
        run: find src scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Composer-Metadaten
        run: composer validate --no-check-publish
      - name: Verhalten und echte Archive
        run: php tests/run.php
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Dialog-Verhalten
        run: node tests/notice-dialog.test.cjs
      - name: Release-Paket und Digest
        run: php scripts/build-release.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MgdEuLabel-php-${{ matrix.php }}
          path: dist/MgdEuLabel.zip*
