name: Qualität
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, curl, mbstring
          tools: composer:v2
          coverage: none
      - name: Syntax
        run: find src scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Composer-Metadaten
        run: composer validate --no-check-publish
      - name: Verhalten und echte Archive
        run: php tests/run.php
      - name: Release-Paket und Digest
        run: php scripts/build-release.php
      - uses: actions/upload-artifact@v4
        with:
          name: MgdEuLabel-php-${{ matrix.php }}
          path: dist/MgdEuLabel.zip*
